<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Acesse a demonstração do Olimpo Lounge.">
  <title>Entrar — Olimpo Lounge</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-layout">
    <img class="brand-art" src="assets/olimpo-cover.jpg" alt="Silhueta e frases originais do Olimpo Lounge">
    <section class="form-panel">
      <div class="login-card">
        <div class="eyebrow">Bem-vindo ao seu espaço</div>
        <p class="intro">Entre com seu e-mail e sua senha de acesso.</p>

        <form id="loginForm">
          <div class="field-group">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
              <input id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="off" required>
            </div>
          </div>

          <div class="field-group">
            <div class="password-label">
              <label for="password">Senha</label>
              <span>8 dígitos</span>
            </div>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></svg>
              <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="••••••••" autocomplete="off" aria-describedby="digitCount" required>
              <span class="digit-count" id="digitCount" aria-live="polite">0/8</span>
            </div>
          </div>

          <p class="form-error" id="formError" role="alert" hidden></p>

          <button class="submit-button" type="submit">
            Acessar painel
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </form>

        <div class="security-note"><span class="lock-icon" aria-hidden="true">⌑</span> Os dados digitados não são enviados nem armazenados.</div>
      </div>

      <footer class="form-footer"><span>OLIMPO LOUNGE</span><span>Gestão com equilíbrio</span></footer>
    </section>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const digitCount = document.getElementById("digitCount");
    const error = document.getElementById("formError");

    password.addEventListener("input", () => {
      password.value = password.value.replace(/\D/g, "").slice(0, 8);
      digitCount.textContent = `${password.value.length}/8`;
      error.hidden = true;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      error.hidden = true;

      if (!form.reportValidity()) return;

      if (!/^\d{8}$/.test(password.value)) {
        error.textContent = "Digite uma senha com exatamente 8 números.";
        error.hidden = false;
        password.focus();
        return;
      }

      window.location.assign("dashboard.html");
    });
  </script>
</body>
</html>
